name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:17 UTC. Catches upstream HA breakage: the "stable" leg
    # tracks each monthly release automatically (it installs the latest
    # published pytest-homeassistant-custom-component), and the "dev" leg
    # tracks pre-releases. The pinned "min" leg is skipped on schedule.
    - cron: "17 3 * * *"

jobs:
  test:
    name: HA ${{ matrix.ha-version }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Skip the pinned "min" leg on the nightly schedule — only stable + dev
    # are worth running against a fresh upstream.
    if: ${{ github.event_name != 'schedule' || matrix.leg != 'min' }}
    strategy:
      fail-fast: false
      matrix:
        # Python is coupled to the HA version, so pair each leg explicitly
        # rather than crossing the two axes (older HA can't run on 3.14, and
        # current HA requires it).
        include:
          # Floor: oldest supported HA. 2026.1.0 is the first release that
          # ships homeassistant.helpers.target.TargetSelection, which the
          # integration imports. Pinned via the matching plugin version.
          - leg: min
            ha-version: "2026.1.0"
            python-version: "3.13"
            phccc: "==0.13.305"
          # Latest stable HA release (plugin unpinned → newest on PyPI).
          - leg: stable
            ha-version: "stable"
            python-version: "3.14"
          # HA dev / pre-release. Non-blocking.
          - leg: dev
            ha-version: "dev"
            python-version: "3.14"
    continue-on-error: ${{ matrix.ha-version == 'dev' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.ha-version }}" = "dev" ]; then
            python -m pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout syrupy
            python -m pip install --pre pytest-homeassistant-custom-component
          else
            python -m pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout \
              "pytest-homeassistant-custom-component${{ matrix.phccc }}" syrupy
          fi

      # The min leg pins HA transitively via the plugin version, so the
      # ha-version label and the phccc pin are two sources of truth that could
      # drift. Assert they agree, failing loudly if a future pin bump forgets
      # to update the label (or vice versa).
      - name: Verify pinned HA version (min leg)
        if: ${{ matrix.leg == 'min' }}
        env:
          EXPECTED_HA: ${{ matrix.ha-version }}
        run: |
          INSTALLED=$(python -c "from homeassistant.const import __version__; print(__version__)")
          echo "Installed HA: $INSTALLED (expected $EXPECTED_HA)"
          if [ "$INSTALLED" != "$EXPECTED_HA" ]; then
            echo "::error::min leg installed HA $INSTALLED but matrix declares $EXPECTED_HA — update the phccc pin to match"
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=custom_components.fado \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ matrix.ha-version }}
          path: coverage.xml
