name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 03:17 UTC. Catches upstream HA breakage: the "stable" leg
    # tracks each monthly release automatically, the "beta" leg tracks
    # pre-releases, and the "dev" leg tracks the tip of HA core. The pinned
    # "min" leg is skipped on schedule.
    - cron: "17 3 * * *"

jobs:
  # Build the test matrix dynamically. Python is coupled to the HA version, so
  # each leg pairs them explicitly rather than crossing the two axes (older HA
  # can't run on 3.14, and current HA requires it). On the nightly schedule we
  # drop the pinned "min" leg — it can't change, so re-running it adds no signal.
  # (The matrix must be built here, not via a job-level `if`, because the
  # `matrix` context is unavailable in `jobs.<id>.if`.)
  configure:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
        run: |
          # Floor: oldest supported HA (see hacs.json). The integration resolves
          # service-call targets via a version shim (custom_components/fado/ha_compat.py):
          # the modern homeassistant.helpers.target.TargetSelection on HA >= 2026.1.0,
          # and the legacy homeassistant.helpers.service helper on older HA. This leg
          # exercises that fallback path. Pinned to the matching plugin version.
          MIN='{"leg":"min","ha-version":"2025.2.0","python-version":"3.13","phccc":"==0.13.210"}'
          # Latest stable HA release, chosen by scripts/ci_ha_install.py.
          STABLE='{"leg":"stable","ha-version":"stable","python-version":"3.14"}'
          # Newest HA beta, and the tip of HA core. Their test failures only warn.
          BETA='{"leg":"beta","ha-version":"beta","python-version":"3.14"}'
          DEV='{"leg":"dev","ha-version":"dev","python-version":"3.14"}'
          if [ "$EVENT" = "schedule" ]; then
            echo "include=[$STABLE,$BETA,$DEV]" >> "$GITHUB_OUTPUT"
          else
            echo "include=[$MIN,$STABLE,$BETA,$DEV]" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: configure
    name: HA ${{ matrix.ha-version }} (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.configure.outputs.include) }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.leg }}" = "min" ]; then
            python -m pip install pytest pytest-asyncio pytest-cov pytest-xdist pytest-timeout \
              "pytest-homeassistant-custom-component${{ matrix.phccc }}" syrupy
          else
            python scripts/ci_ha_install.py "${{ matrix.leg }}" \
              --extra pytest --extra pytest-asyncio --extra pytest-cov \
              --extra pytest-xdist --extra pytest-timeout --extra syrupy
          fi
          python -c "from homeassistant.const import __version__; print(__version__)"

      # The min leg pins HA transitively via the plugin version, so the
      # ha-version label and the phccc pin are two sources of truth that could
      # drift. Assert they agree, failing loudly if a future pin bump forgets
      # to update the label (or vice versa).
      - name: Verify pinned HA version (min leg)
        if: ${{ matrix.leg == 'min' }}
        env:
          EXPECTED_HA: ${{ matrix.ha-version }}
        run: |
          INSTALLED=$(python -c "from homeassistant.const import __version__; print(__version__)")
          echo "Installed HA: $INSTALLED (expected $EXPECTED_HA)"
          if [ "$INSTALLED" != "$EXPECTED_HA" ]; then
            echo "::error::min leg installed HA $INSTALLED but matrix declares $EXPECTED_HA — update the phccc pin to match"
            exit 1
          fi

      - name: Run tests with coverage
        id: pytest
        # An unreleased HA must not block a PR. This sits on the step because a
        # failed install must still fail the leg: a job that ended up on the
        # wrong HA version would otherwise look like a real test of that version.
        continue-on-error: ${{ matrix.leg == 'beta' || matrix.leg == 'dev' }}
        run: |
          pytest tests/ \
            --cov=custom_components.fado \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=90 \
            -v

      - name: Warn when an unreleased Home Assistant fails the suite
        if: steps.pytest.outcome == 'failure'
        run: echo "::warning::Pytest failed on Home Assistant ${{ matrix.leg }}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.python-version }}-${{ matrix.ha-version }}
          path: coverage.xml

  # Stable-named gate for branch protection. The individual test legs carry
  # dynamic names (the HA version moves), so requiring them directly would
  # break the rule on every floor bump. This aggregates them into one fixed
  # check that is green only when every blocking leg passed. On the "beta" and
  # "dev" legs the test step is continue-on-error, so a test failure there does
  # not flip needs.test.result, but a failed install does.
  # 90% coverage is enforced inside each leg via --cov-fail-under=90, so a
  # green "tests-passed" also guarantees the coverage floor.
  tests-passed:
    name: tests-passed
    needs: test
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all blocking test legs to pass
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          echo "Aggregated test result: $TEST_RESULT"
          if [ "$TEST_RESULT" != "success" ]; then
            echo "::error::one or more required test legs failed or were skipped"
            exit 1
          fi
