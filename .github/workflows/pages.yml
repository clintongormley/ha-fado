name: Docs site

# The site is PUBLISHED on release only. The docs describe the released
# integration, and CHANGES.md is rendered as the changelog page, so publishing
# from main would show users an Unreleased section describing code they cannot
# install yet. By release time the flow in release.yml has already promoted
# `## [Unreleased]` into a version section, so the published changelog holds
# released entries only.
#
# Publishing happens through exactly one route: a workflow_dispatch on main,
# fired by release.yml's last step. Two GitHub rules force that shape, and both
# rule out the obvious alternatives:
#
#   - `release: published` would never fire for the automated flow. release.yml
#     creates the Release with GITHUB_TOKEN, and GitHub does not start workflow
#     runs from token-triggered events. workflow_dispatch is exempt.
#   - Deploying from a tag ref would be rejected regardless. The github-pages
#     environment's deployment branch policy permits `main` only, and release
#     events (and tag pushes) run from refs/tags/v*. That applies to a release
#     published by hand through the UI too — so there is no useful fallback
#     trigger to add here; it would fail rather than help.
#
# Pushes to main and pull requests still BUILD but never deploy, so a broken
# link or a failed demo build surfaces when it lands rather than months later
# at release. Use workflow_dispatch on main to publish out of band — a doc
# correction that should not wait for the next version.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "custom_components/fado/brand/**"
      - "custom_components/fado/frontend/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/build_site.sh"
      - "CHANGES.md"
      - "tests/frontend/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "custom_components/fado/brand/**"
      - "custom_components/fado/frontend/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/build_site.sh"
      - "CHANGES.md"
      - "tests/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Ordered to fail fast: the frontend suite is the cheapest gate and the
      # one most likely to catch this workflow's target failure (a docs page
      # renamed out from under a demo link), so it runs before the Python
      # toolchain and the demo's dependencies are installed for the build.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install frontend test dependencies
        run: npm ci

      # Guards the vendored demo's links against the docs pages they point at.
      - name: Frontend tests
        run: npm test

      - name: Install demo dependencies
        run: npm ci
        working-directory: demo

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - name: Build site
        run: scripts/build_site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Pushes to main and pull requests run the identical build without deploying,
  # so a broken link fails the PR rather than the live site.
  deploy:
    # GitHub already skips a job whose `needs:` dependency failed, even with a
    # custom `if:` — that implicit success() gate only gets overridden by a
    # status function (always()/failure()/cancelled()), which this condition
    # doesn't use. So `needs.build.result == 'success'` is redundant, but it's
    # kept anyway: it's self-documenting and won't silently stop working if a
    # future edit adds a status function elsewhere in the expression.
    # Only a manual dispatch publishes, and only from `main` — workflow_dispatch
    # can be run from any branch, and without the ref check a dispatch from a
    # feature branch would push that branch's build to production Pages. A push
    # to main deliberately builds without deploying; see the trigger comment at
    # the top of this file for why this is the only publish route.
    if: >-
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
