name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/build_site.sh"
      - "CHANGES.md"
      - "tests/frontend/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "demo/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/build_site.sh"
      - "CHANGES.md"
      - "tests/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install -r requirements-docs.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json

      - name: Install demo dependencies
        run: npm ci
        working-directory: demo

      - name: Install frontend test dependencies
        run: npm ci

      # Guards the vendored demo's links against the docs pages they point at.
      - name: Frontend tests
        run: npm test

      - name: Build site
        run: scripts/build_site.sh

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  # Pull requests run the identical build without deploying, so a broken link
  # fails the PR rather than the live site.
  deploy:
    # GitHub already skips a job whose `needs:` dependency failed, even with a
    # custom `if:` — that implicit success() gate only gets overridden by a
    # status function (always()/failure()/cancelled()), which this condition
    # doesn't use. So `needs.build.result == 'success'` is redundant, but it's
    # kept anyway: it's self-documenting and won't silently stop working if a
    # future edit adds a status function elsewhere in the expression.
    # The second half restricts deploys to `main`: pushes are already
    # branch-filtered above, but `workflow_dispatch` can be run from any
    # branch, and without this a manual dispatch from a feature branch would
    # publish that branch's build to production Pages.
    if: needs.build.result == 'success' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      contents: read
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
