[project]
name = "fade_lights"
version = "0.1.0"
description = "Home Assistant custom integration for smooth light fading"
requires-python = ">=3.12"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-homeassistant-custom-component>=0.13.300",
    "pytest-timeout>=2.3.0",
    "pytest-xdist>=3.5.0",
    "syrupy>=4.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# Run tests in parallel: many fade tests are wall-clock sleep-bound, so they
# parallelise almost perfectly. Disable for debugging with `-p no:xdist`.
# timeout is a safety net so a hung test fails fast instead of wedging the run.
addopts = "-n auto"
timeout = 60

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
